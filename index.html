<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuHG</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: #0a0a0f; font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e2e8; }

        #topbar {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: #13131a;
            border-bottom: 1px solid #222230; flex-wrap: wrap;
        }
        .brand { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7c6dfa; }
        .field-group { display: flex; align-items: center; gap: 6px; }
        .field-group label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .06em; }
        .field-group input {
            width: 80px; padding: 4px 8px;
            background: #1e1e2e; border: 1px solid #2e2e42; border-radius: 6px;
            color: #e2e2e8; font-size: 13px; outline: none;
        }
        .field-group input:focus { border-color: #7c6dfa; }

        #lang-toggle { display: flex; background: #1e1e2e; border: 1px solid #2e2e42; border-radius: 8px; overflow: hidden; }
        #lang-toggle button { padding: 5px 14px; font-size: 12px; font-weight: 600; border: none; background: transparent; color: #888; cursor: pointer; }
        #lang-toggle button.active { background: #7c6dfa; color: #fff; }

        #autonext-wrap { display: flex; align-items: center; gap: 7px; }
        #autonext-wrap span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .06em; }
        .switch { position: relative; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #2e2e42; border-radius: 20px; cursor: pointer; transition: background .2s; }
        .slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
        .switch input:checked + .slider { background: #7c6dfa; }
        .switch input:checked + .slider::before { transform: translateX(16px); }

        .ctrl-btns { display: flex; gap: 6px; align-items: center; }
        .bar-btn { display: flex; align-items: center; gap: 5px; padding: 5px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        #btn-prev-bar, #btn-next-bar { background: #1e1e2e; color: #aaa; border: 1px solid #2e2e42; }
        #btn-go { background: #7c6dfa; color: #fff; }

        .spin { width: 14px; height: 14px; border: 2px solid #2e2e42; border-top-color: #7c6dfa; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #extract-spinner { display: none; align-items: center; gap: 6px; color: #a78bfa; font-size: 12px; font-weight: 600; background: rgba(167,139,250,.12); padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(167,139,250,.25); }

        /* Player area */
        #output {
            padding: 16px 14px;
        }

        .label-hint {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: #555;
        }
        .error { color: #f87171; font-family: monospace; font-size: 13px; }

        /* Stream cards */
        .stream-card {
            margin-bottom: 24px;
        }
        .stream-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #7c6dfa;
            margin-bottom: 8px;
        }
        .stream-url {
            font-family: monospace;
            font-size: 10px;
            color: #444;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .stream-card iframe {
            width: 100%;
            height: 480px;
            border: 1px solid #2e2e42;
            border-radius: 10px;
            background: #000;
            display: block;
        }
        .stream-card .no-iframe-note {
            font-size: 11px;
            color: #666;
            font-style: italic;
            padding: 8px 0;
        }
    </style>
</head>
<body>

<div id="topbar">
    <span class="brand">&#9654; OtakuHG</span>
    <div class="field-group">
        <label>MAL ID</label>
        <input id="inp-mal" type="number" placeholder="e.g. 21" min="1">
    </div>
    <div class="field-group">
        <label>Episode</label>
        <input id="inp-ep" type="number" placeholder="e.g. 1" min="1">
    </div>
    <div id="lang-toggle">
        <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
        <button id="btn-sub" onclick="setLang('sub')">SUB</button>
    </div>
    <div id="autonext-wrap">
        <span>Auto-Next</span>
        <label class="switch"><input type="checkbox" id="chk-autonext" checked><span class="slider"></span></label>
    </div>
    <div class="ctrl-btns">
        <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">&#8592; Prev</button>
        <button class="bar-btn" id="btn-go" onclick="loadPlayer()">&#9654; Play</button>
        <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">Next &#8594;</button>
        <div id="extract-spinner"><div class="spin"></div><span>Extracting...</span></div>
    </div>
</div>

<div id="output"><span class="label-hint">Enter MAL ID + Episode then press Play</span></div>

<script>
    const BASE_DATASET_URL = "https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/";
    const DATASET_FILENAMES = ["hianime_streams_list.json"].concat(
        Array.from({ length: 36 }, (_, i) => `hianime_streams_list_${i + 2}.json`)
    );

    let datasetCache = null;
    let currentLang = 'dub';
    let _fetchToken = 0;
    const streamCache = new Map();

    function getProxyUrl(url) {
        if (!url) return '';
        if (url.startsWith('https://anivexa.onrender.com/proxy')) return url;
        const clean = url.split('?')[0].toLowerCase();
        if (clean.endsWith('.txt') || clean.endsWith('.m3u8')) {
            return `https://anivexa.onrender.com/proxy?url=${encodeURIComponent(url)}&referer=https://otakuhg.site/`;
        }
        return url;
    }

    function isTxtProxy(url) {
        if (!url) return false;
        // Check if it's a proxy wrapping a .txt URL (not .m3u8)
        try {
            const u = new URL(url);
            const inner = u.searchParams.get('url') || '';
            const innerClean = inner.split('?')[0].toLowerCase();
            if (innerClean.endsWith('.txt')) return true;
        } catch(e) {}
        // Direct .txt check
        return url.split('?')[0].toLowerCase().endsWith('.txt');
    }

    async function loadAllDatasets() {
        if (datasetCache) return datasetCache;
        const results = await Promise.all(
            DATASET_FILENAMES.map(f => fetch(BASE_DATASET_URL + f).then(r => r.ok ? r.json() : []).catch(() => []))
        );
        datasetCache = results.flat();
        return datasetCache;
    }

    async function searchOtakuHG(malId, epNum) {
        const datasets = await loadAllDatasets();
        return datasets.find(item => {
            const mid = String(item["mal_id/anilist_id/tmdb_id"] || item.mal_id || '').trim();
            const ep  = String(item["episode_no"] || item.ep || '').trim();
            return mid === String(malId).trim() && ep === String(epNum).trim();
        });
    }

    async function fetchHtmlWithProxy(url) {
        const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            `https://corsproxy.io/?${encodeURIComponent(url)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];
        for (const p of proxies) {
            try {
                const res = await fetch(p);
                if (res.ok) { const t = await res.text(); if (t && t.length > 50) return t; }
            } catch (e) {}
        }
        throw new Error("All CORS proxies failed");
    }

    function unpackPackedJS(html) {
        const match = html.match(/eval\(function\(p,a,c,k,e,d\).*?'(.*?)',(\d+),(\d+),'(.*?)'\.split\('\|'\)\)\)/s);
        if (!match) return "";
        let payload = match[1];
        const base = parseInt(match[2], 10), count = parseInt(match[3], 10), words = match[4].split("|");
        function unbase(n, b) {
            const c = "0123456789abcdefghijklmnopqrstuvwxyz"; let r = "";
            while (n > 0) { r = c[n % b] + r; n = Math.floor(n / b); }
            return r || "0";
        }
        for (let i = count - 1; i >= 0; i--) {
            if (words[i]) payload = payload.replace(new RegExp('\\b' + unbase(i, base) + '\\b', 'g'), words[i]);
        }
        return payload;
    }

    async function parseMasterPlaylist(masterUrl) {
        try {
            const res = await fetch(getProxyUrl(masterUrl));
            if (!res.ok) return [];
            const text = await res.text();
            const base = masterUrl.substring(0, masterUrl.lastIndexOf("/") + 1);
            const variants = [];
            const lines = text.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith("#EXT-X-STREAM-INF:")) {
                    const rm = line.match(/RESOLUTION=(\d+x\d+)/i);
                    const res = rm ? rm[1] : "HD";
                    let q = "HD";
                    if (res.includes("1920")||res.includes("1080")) q="1080p";
                    else if (res.includes("1280")||res.includes("720")) q="720p";
                    else if (res.includes("854")||res.includes("480")) q="480p";
                    else if (res.includes("640")||res.includes("360")) q="360p";
                    const next = lines[i+1] && lines[i+1].trim();
                    if (next && !next.startsWith("#")) {
                        const abs = next.startsWith("http") ? next : base + next;
                        variants.push({ quality: q, url: abs });
                    }
                }
            }
            return variants;
        } catch (e) { return []; }
    }

    async function extractStreams(embedUrl) {
        try {
            const html = await fetchHtmlWithProxy(embedUrl);
            const js = unpackPackedJS(html);
            let masterUrl = null;
            const lm = js.match(/var\s+links\s*=\s*(\{.*?\});/);
            if (lm) {
                try {
                    const raw = JSON.parse(lm[1]);
                    const domain = embedUrl.substring(0, embedUrl.indexOf("/", 8));
                    masterUrl = raw.hls4 || raw.hls3 || raw.hls2;
                    if (masterUrl && masterUrl.startsWith("/")) masterUrl = domain + masterUrl;
                } catch (e) {}
            }
            if (!masterUrl) {
                const m = (js + html).match(/https?:\/\/[^\s"'<>]+?(?:master\.txt|\.m3u8)[^\s"'<>]*/i);
                if (m) masterUrl = m[0];
            }
            const variants = masterUrl ? await parseMasterPlaylist(masterUrl) : [];
            return { masterUrl, variants };
        } catch (e) { return { masterUrl: null, variants: [] }; }
    }

    async function getStreams(malId, epNum) {
        const key = `${malId}_${epNum}`;
        if (streamCache.has(key)) return streamCache.get(key);
        const p = (async () => {
            const entry = await searchOtakuHG(malId, epNum);
            if (!entry) throw new Error(`MAL ${malId} Ep ${epNum} not found`);
            const title = entry.anime_name || entry.title || `Anime ${malId}`;
            const embedEntries = [];
            Object.keys(entry).forEach(k => {
                const v = entry[k];
                if (typeof v !== 'string') return;
                const kl = k.toLowerCase(), vl = v.toLowerCase();
                if (vl.includes("otakuhg.site") || kl.includes("streamhg") || kl.includes("otakuhg"))
                    embedEntries.push({ url: v, lang: kl.includes("dub") ? "dub" : "sub" });
            });
            if (!embedEntries.length) {
                Object.keys(entry).forEach(k => {
                    const v = entry[k];
                    if (typeof v === 'string' && v.startsWith("http"))
                        embedEntries.push({ url: v, lang: k.toLowerCase().includes("dub") ? "dub" : "sub" });
                });
            }
            const streams = [];
            for (const emb of embedEntries) {
                const ex = await extractStreams(emb.url);
                if (ex.variants.length) {
                    ex.variants.forEach(v => streams.push({ label: `[${emb.lang.toUpperCase()}] ${v.quality}`, url: getProxyUrl(v.url) }));
                } else if (ex.masterUrl) {
                    streams.push({ label: `[${emb.lang.toUpperCase()}] HD`, url: getProxyUrl(ex.masterUrl) });
                } else {
                    streams.push({ label: `[${emb.lang.toUpperCase()}] Embed`, url: emb.url });
                }
            }
            return { title, streams };
        })();
        streamCache.set(key, p);
        return p;
    }

    function renderStreams(streams, lang) {
        const output = document.getElementById('output');

        // Sort preferred lang first
        const sorted = [...streams].sort((a, b) => {
            const al = a.label.toLowerCase().includes(lang);
            const bl = b.label.toLowerCase().includes(lang);
            return al === bl ? 0 : al ? -1 : 1;
        });

        if (!sorted.length) {
            output.innerHTML = '<span class="label-hint">No streams found.</span>';
            return;
        }

        output.innerHTML = '';

        sorted.forEach(s => {
            const card = document.createElement('div');
            card.className = 'stream-card';

            const labelEl = document.createElement('div');
            labelEl.className = 'stream-label';
            labelEl.textContent = s.label;
            card.appendChild(labelEl);

            const urlEl = document.createElement('div');
            urlEl.className = 'stream-url';
            urlEl.textContent = s.url;
            card.appendChild(urlEl);

            if (isTxtProxy(s.url)) {
                const iframeId = 'voeFrame_' + Math.random().toString(36).slice(2);
                const encodedSrc = encodeURIComponent(s.url);
                const playerPage = `https://raw.githack.com/srtfile/hi_anime_streams_scraper/main/player.html?src=${encodedSrc}`;
                const iframe = document.createElement('iframe');
                iframe.id = iframeId;
                iframe.src = `https://hlsplayer.online/?url=${encodedSrc}`;
                iframe.width = '100%';
                iframe.height = '500px';
                iframe.setAttribute('frameborder', '0');
                iframe.allowFullscreen = true;
                card.appendChild(iframe);

                // Also add a direct HLS player below using a srcdoc
                const player = document.createElement('iframe');
                player.width = '100%';
                player.height = '500px';
                player.setAttribute('frameborder', '0');
                player.allowFullscreen = true;
                player.srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;background:#000}video{width:100%;height:100vh}</style></head><body><video id="v" controls autoplay playsinline></video><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script><script>var v=document.getElementById('v');if(Hls.isSupported()){var h=new Hls({xhrSetup:function(xhr){xhr.withCredentials=false;}});h.loadSource(${JSON.stringify(s.url)});h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,function(){v.play();});}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=${JSON.stringify(s.url)};v.play();}<\/script></body></html>`;
                card.appendChild(player);
            }

            output.appendChild(card);
        });
    }

    async function showPlayer(malId, ep, lang) {
        currentLang = lang;
        const tok = ++_fetchToken;
        document.getElementById('inp-mal').value = malId;
        document.getElementById('inp-ep').value = ep;
        document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
        document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
        document.getElementById('extract-spinner').style.display = 'flex';
        document.getElementById('output').innerHTML = '<span class="label-hint">Extracting...</span>';
        try {
            const data = await getStreams(malId, ep);
            if (tok !== _fetchToken) return;
            renderStreams(data.streams, lang);
        } catch (err) {
            if (tok !== _fetchToken) return;
            document.getElementById('output').innerHTML = `<span class="error">Error: ${err.message}</span>`;
        } finally {
            if (tok === _fetchToken) document.getElementById('extract-spinner').style.display = 'none';
        }
    }

    function loadPlayer() {
        const malId = document.getElementById('inp-mal').value.trim();
        const ep = document.getElementById('inp-ep').value.trim();
        if (!malId || !ep) return;
        showPlayer(malId, ep, currentLang);
    }

    function goPrevEp() {
        const malId = document.getElementById('inp-mal').value.trim();
        const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
        if (!malId || isNaN(ep) || ep <= 1) return;
        showPlayer(malId, ep - 1, currentLang);
    }

    function goNextEp() {
        const malId = document.getElementById('inp-mal').value.trim();
        const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
        if (!malId || isNaN(ep)) return;
        showPlayer(malId, ep + 1, currentLang);
    }

    function setLang(lang) {
        currentLang = lang;
        document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
        document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
    }

    function parseParamsFromUrl() {
        const path = window.location.pathname, search = window.location.search, hash = window.location.hash;
        let m = path.match(/\/(\d+)\/(\d+)(?:\/(dub|sub))?\/?$/i);
        if (m) return { malId: m[1], epNum: m[2], lang: m[3] || 'dub' };
        m = search.match(/\?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
        if (m) return { malId: m[1], epNum: m[2], lang: m[3] || 'dub' };
        const p = new URLSearchParams(search);
        const qMal = p.get('mal_id') || p.get('malId') || p.get('id');
        const qEp  = p.get('ep') || p.get('ep_num') || p.get('episode');
        if (qMal && qEp) return { malId: qMal, epNum: qEp, lang: p.get('lang') || 'dub' };
        m = hash.match(/#\/?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
        if (m) return { malId: m[1], epNum: m[2], lang: m[3] || 'dub' };
        return null;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const params = parseParamsFromUrl();
        if (params) showPlayer(params.malId, params.epNum, params.lang);
    });

    document.addEventListener('keydown', e => { if (e.key === 'Enter') loadPlayer(); });
</script>
</body>
</html>
